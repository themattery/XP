<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ranking Geral</title>
    <link rel="stylesheet" th:href="@{/css/ranking.css}">
</head>
<body>

<div class="xp-window">
    <div class="xp-titlebar">
        <span>📊 Ranking Geral - Histórico do Sistema</span>
        <div class="xp-min-max-close">
            <div class="xp-sys-btn close" onclick="window.location.href='/corridas'">X</div>
        </div>
    </div>

    <div class="xp-menu-bar">
        <a th:href="@{/corridas}" class="xp-button" style="font-size: 11px;">
            ⬅️ Voltar para o Lobby
        </a>

        <span style="margin-left: auto; font-weight: bold; color: #003099;">
            👤 Piloto:
            <span th:text="${usuarioLogado}">Usuário</span>
        </span>
    </div>

    <div class="xp-body">
        <h2 class="xp-header-title">Ranking Geral de Participantes</h2>

        <table class="xp-table">
            <thead>
                <tr>
                    <th style="width: 60px;">Posição</th>
                    <th>Participante</th>
                    <th>Corrida</th>
                    <th>Pontuação</th>
                    <th>Data</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="r, stat : ${resultados}">
                    <td th:text="${currentPage * pageSize + stat.count}">1</td>
                    <td th:text="${r.participante.nome}">Nome</td>
                    <td th:text="${r.corrida.nome}">Corrida</td>
                    <td th:text="${r.pontuacao + ' pts'}">0 pts</td>
                    <td th:text="${#temporals.format(r.dataHora, 'dd/MM/yyyy HH:mm')}">
                        Data
                    </td>
                </tr>
            </tbody>
        </table>

        <div style="margin-top:15px;text-align:center;">

            <a th:if="${currentPage > 0}"
               th:href="@{/ranking(page=${currentPage - 1})}"
               class="xp-button">
                ◀ Anterior
            </a>

            <span style="margin:0 15px;">
                Página
                <span th:text="${currentPage + 1}"></span>
                de
                <span th:text="${totalPages}"></span>
            </span>

            <a th:if="${currentPage + 1 < totalPages}"
               th:href="@{/ranking(page=${currentPage + 1})}"
               class="xp-button">
                Próxima ▶
            </a>

        </div>
    </div>
</div>

</body>
</html>
