<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ranking da Corrida</title>
    <link rel="stylesheet" th:href="@{/css/ranking.css}">
</head>
<body>

<div class="xp-window">
    <div class="xp-titlebar">
        <span>Histórico do Circuito - Windows XP</span>
        <div class="xp-min-max-close">
            <div class="xp-sys-btn close" onclick="window.location.href='/corridas'">X</div>
        </div>
    </div>

    <div class="xp-menu-bar">
        <a th:href="@{/corridas}" class="xp-button" style="font-size: 11px;">
            Voltar para o Lobby
        </a>

        <form th:action="@{/ranking/corrida/{id}(id=${corrida.id})}"
              method="get"
              class="xp-page-size-form"
              style="display:flex; align-items:center; gap:8px; margin: 0 12px;"
              onsubmit="document.getElementById('corridaSize').value = this.customSize.value || this.presetSize.value;">

            <input type="hidden" name="page" value="0">
            <input type="hidden" id="corridaSize" name="size" th:value="${pageSize}">

            <label style="font-weight:bold; color:#003099;">
                Linhas:
            </label>

            <select id="presetSize"
                    name="presetSize"
                    onchange="document.getElementById('corridaSize').value = this.value; this.form.submit();">

                <option th:each="option : ${pageSizeOptions}"
                        th:value="${option}"
                        th:text="${option}"
                        th:selected="${option == pageSize}">
                </option>

            </select>

            <input type="number"
                   name="customSize"
                   min="1"
                   placeholder="Livre"
                   style="width:82px; padding:4px 6px;">

            <button type="submit"
                    class="xp-button"
                    style="font-size:11px;">
                Aplicar
            </button>
        </form>

        <span style="margin-left:auto; font-weight:bold; color:#003099;">
            Piloto:
            <span th:text="${usuarioLogado}">Usuário</span>
        </span>
    </div>

    <div class="xp-body">

        <h2 class="xp-header-title"
            th:text="'Ranking - ' + ${corrida.nome}">
            Ranking
        </h2>

        <table class="xp-table">
            <thead>
            <tr>
                <th style="width:60px;">Posição</th>
                <th>Participante</th>
                <th>Pontuação</th>
                <th>Data</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="r, stat : ${resultados}">
                <td th:text="${currentPage * pageSize + stat.count}">1</td>
                <td th:text="${r.participante.nome}">Nome</td>
                <td th:text="${r.pontuacao + ' pts'}">0 pts</td>
                <td th:text="${#temporals.format(r.dataHora, 'dd/MM/yyyy HH:mm')}">
                    Data
                </td>
            </tr>
            </tbody>
        </table>

        <div style="margin-top:15px;text-align:center;">

            <a th:if="${currentPage > 0}"
               th:href="@{/ranking/corrida/{id}(id=${corrida.id},page=${currentPage - 1},size=${pageSize})}"
               class="xp-button">
                ◀ Anterior
            </a>

            <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">

                <a th:if="${i != currentPage}"
                   th:href="@{/ranking/corrida/{id}(id=${corrida.id},page=${i},size=${pageSize})}"
                   class="xp-button"
                   th:text="${i + 1}">
                </a>

                <span th:if="${i == currentPage}"
                      style="font-weight:bold;padding:4px 8px;border:1px solid #003099;background:#dbe8ff;"
                      th:text="${i + 1}">
                </span>

            </span>

            <a th:if="${currentPage + 1 < totalPages}"
               th:href="@{/ranking/corrida/{id}(id=${corrida.id},page=${currentPage + 1},size=${pageSize})}"
               class="xp-button">
                Próxima ▶
            </a>

        </div>

    </div>
</div>

</body>
</html>
