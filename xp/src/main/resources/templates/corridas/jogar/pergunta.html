<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>XP Corridas - Pergunta</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; }

        .login-screen__center {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .jogo-header {
            text-align: center;
            margin-bottom: 24px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-family: Tahoma, sans-serif;
        }

        .jogo-header h1 { margin: 0 0 8px; font-size: 2.2em; }

        .jogo-content {
            width: 90%;
            max-width: 720px;
            background: rgba(255, 255, 255, 0.95);
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #00489a;
            color: #333;
            font-family: Tahoma, sans-serif;
        }

        .jogo-progresso {
            font-size: 0.95em;
            color: #555;
            margin-bottom: 16px;
        }

        .jogo-enunciado {
            font-size: 1.25em;
            font-weight: bold;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .alternativa {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }

        .alternativa:hover {
            background: #f0f7ff;
            border-color: #0058e3;
        }

        .alternativa input {
            margin: 0;
            cursor: pointer;
        }

        .feedback {
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-weight: bold;
        }

        .feedback--ok {
            background: #e8f5e9;
            border: 1px solid #4caf50;
            color: #2e7d32;
        }

        .feedback--erro {
            background: #ffebee;
            border: 1px solid #e53935;
            color: #c62828;
        }

        .jogo-actions {
            margin-top: 24px;
            display: flex;
            justify-content: flex-end;
        }

        .timer-container {
            text-align: center;
            margin-bottom: 16px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 4px;
            border: 2px solid #00489a;
        }

        .timer-display {
            font-size: 2em;
            font-weight: bold;
            color: #00489a;
        }

        .timer-display.warning {
            color: #ff9800;
        }

        .timer-display.danger {
            color: #f44336;
        }
    </style>
</head>
<body>
<div class="login-screen">
    <div class="login-screen__top"></div>

    <div class="login-screen__center">

        <div class="jogo-header">
            <h1 th:text="'🏎️ ' + ${corrida.nome}">Corrida</h1>
            <p th:if="${session.usuario != null}" th:text="'Jogador: ' + ${session.usuario}">Jogador</p>
        </div>

        <div class="jogo-content">

            <div th:if="${session.tempoLimiteSegundos != null}" class="timer-container">
                <p>Tempo restante:</p>
                <div id="timer" class="timer-display" th:data-tempo-limite="${session.tempoLimiteSegundos}">00:00</div>
            </div>

            <p class="jogo-progresso"
               th:text="'Pergunta ' + ${numero} + ' de ' + ${total}">
                Pergunta 1 de 3
            </p>

            <div th:if="${feedbackMensagem != null}"
                 class="feedback"
                 th:classappend="${feedbackCorreto} ? ' feedback--ok' : ' feedback--erro'"
                 th:text="${feedbackMensagem}">
                Feedback
            </div>

            <p th:if="${erro != null}" class="feedback feedback--erro" th:text="${erro}"></p>

            <p class="jogo-enunciado" th:text="${pergunta.enunciado}">
                Enunciado da pergunta
            </p>

            <form th:action="@{/corridas/jogar/responder}" method="post">
                <input type="hidden" name="perguntaId" th:value="${pergunta.id}">

                <label class="alternativa"
                       th:each="alt, stat : ${pergunta.alternativas}"
                       th:for="${'resposta-' + stat.index}">
                    <input type="radio"
                           name="resposta"
                           th:id="${'resposta-' + stat.index}"
                           th:value="${stat.index}"
                           required>
                    <span th:text="${alt}">Alternativa</span>
                </label>

                <div class="jogo-actions">
                    <button type="submit" class="login-screen__submit">Confirmar resposta</button>
                </div>
            </form>

        </div>

    </div>

    <div class="login-screen__bottom">
        <div class="login-screen__login-info">
            <span>XP Corridas © IFPB PWEB2</span>
        </div>
    </div>
</div>

<script th:if="${session.tempoLimiteSegundos != null}">
    (function() {
        const timerElement = document.getElementById('timer');
        const tempoLimiteSegundos = parseInt(timerElement.getAttribute('data-tempo-limite'));
        let tempoRestante = tempoLimiteSegundos;

        function formatarTempo(segundos) {
            const minutos = Math.floor(segundos / 60);
            const seg = segundos % 60;
            return String(minutos).padStart(2, '0') + ':' + String(seg).padStart(2, '0');
        }

        function atualizarTimer() {
            timerElement.textContent = formatarTempo(tempoRestante);

            if (tempoRestante <= 10) {
                timerElement.classList.add('danger');
            } else if (tempoRestante <= 30) {
                timerElement.classList.add('warning');
            }

            if (tempoRestante <= 0) {
                window.location.href = '/corridas/jogar/fim';
                return;
            }

            tempoRestante--;
        }

        atualizarTimer();
        setInterval(atualizarTimer, 1000);
    })();
</script>

</body>
</html>
