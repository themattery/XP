<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>XP Corridas - Pergunta</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; }

        .login-screen__center {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .jogo-header {
            text-align: center;
            margin-bottom: 24px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-family: Tahoma, sans-serif;
        }

        .jogo-header h1 { margin: 0 0 8px; font-size: 2.2em; }

        .jogo-content {
            width: 90%;
            max-width: 720px;
            background: rgba(255, 255, 255, 0.95);
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #00489a;
            color: #333;
            font-family: Tahoma, sans-serif;
        }

        .jogo-progresso {
            font-size: 0.95em;
            color: #555;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tempo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tempo-display {
            font-weight: bold;
            color: #00489a;
            font-size: 1.1em;
            min-width: 50px;
        }

        .tempo-barra {
            width: 200px;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }

        .tempo-barra-preenchida {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #ffc107, #f44336);
            width: 100%;
            transition: width 0.1s linear;
        }

        .jogo-enunciado {
            font-size: 1.25em;
            font-weight: bold;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .alternativa {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }

        .alternativa:hover {
            background: #f0f7ff;
            border-color: #0058e3;
        }

        .alternativa input {
            margin: 0;
            cursor: pointer;
        }

        .feedback {
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-weight: bold;
        }

        .feedback--ok {
            background: #e8f5e9;
            border: 1px solid #4caf50;
            color: #2e7d32;
        }

        .feedback--erro {
            background: #ffebee;
            border: 1px solid #e53935;
            color: #c62828;
        }

        .jogo-actions {
            margin-top: 24px;
            display: flex;
            justify-content: flex-end;
        }

        .tempo-alerta {
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { color: #f44336; }
            50% { color: #c62828; }
        }
    </style>
</head>
<body>
<div class="login-screen">
    <div class="login-screen__top"></div>

    <div class="login-screen__center">

        <div class="jogo-header">
            <h1 th:text="'🏎️ ' + ${corrida.nome}">Corrida</h1>
            <p th:if="${session.usuario != null}" th:text="'Jogador: ' + ${session.usuario}">Jogador</p>
        </div>

        <div class="jogo-content">

            <div class="jogo-progresso">
                <span th:text="'Pergunta ' + ${numero} + ' de ' + ${total}">Pergunta 1 de 3</span>
                <div class="tempo-container" th:if="${corrida.tempoLimitadoSegundos != null and corrida.tempoLimitadoSegundos > 0}">
                    <span class="tempo-display" id="tempoDisplay">--</span>
                    <div class="tempo-barra">
                        <div class="tempo-barra-preenchida" id="tempoBarraPreenchida"></div>
                    </div>
                </div>
            </div>

            <div th:if="${feedbackMensagem != null}"
                 class="feedback"
                 th:classappend="${feedbackCorreto} ? ' feedback--ok' : ' feedback--erro'"
                 th:text="${feedbackMensagem}">
                Feedback
            </div>

            <p th:if="${erro != null}" class="feedback feedback--erro" th:text="${erro}"></p>

            <p class="jogo-enunciado" th:text="${pergunta.enunciado}">
                Enunciado da pergunta
            </p>

            <form th:action="@{/corridas/jogar/responder}" method="post" id="formResposta">
                <input type="hidden" name="perguntaId" th:value="${pergunta.id}">

                <label class="alternativa"
                       th:each="alt, stat : ${pergunta.alternativas}"
                       th:for="${'resposta-' + stat.index}">
                    <input type="radio"
                           name="resposta"
                           th:id="${'resposta-' + stat.index}"
                           th:value="${stat.index}"
                           required>
                    <span th:text="${alt}">Alternativa</span>
                </label>

                <div class="jogo-actions">
                    <button type="submit" class="login-screen__submit" id="btnSubmit">Confirmar resposta</button>
                </div>
            </form>

        </div>

    </div>

    <div class="login-screen__bottom">
        <div class="login-screen__login-info">
            <span>XP Corridas © IFPB PWEB2</span>
        </div>
    </div>
</div>

<script th:if="${corrida.tempoLimitadoSegundos != null and corrida.tempoLimitadoSegundos > 0}">
    let tempoTotal = [[${corrida.tempoLimitadoSegundos}]];
    let tempoRestante = tempoTotal;
    let tempoInicio = Date.now();

    function atualizarTempo() {
        let tempoDecorrido = Math.floor((Date.now() - tempoInicio) / 1000);
        tempoRestante = tempoTotal - tempoDecorrido;

        if (tempoRestante <= 0) {
            tempoRestante = 0;
            clearInterval(intervalo);
            document.getElementById('formResposta').submit();
            return;
        }

        let percentual = (tempoRestante / tempoTotal) * 100;
        document.getElementById('tempoDisplay').textContent = tempoRestante + 's';
        document.getElementById('tempoBarraPreenchida').style.width = percentual + '%';

        if (tempoRestante <= 10) {
            document.getElementById('tempoDisplay').classList.add('tempo-alerta');
        }
    }

    let intervalo = setInterval(atualizarTempo, 100);
    atualizarTempo();
</script>
</body>
</html>
