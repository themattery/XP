<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>XP Corridas - Nova Pergunta</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; }

        .login-screen__center {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-family: Tahoma, sans-serif;
        }

        .form-header h1 { font-size: 2.2em; margin: 0; }

        .form-content {
            width: 90%;
            max-width: 560px;
            background: rgba(255, 255, 255, 0.95);
            padding: 36px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #00489a;
            color: #333;
            font-family: Tahoma, sans-serif;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #00489a;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1em;
        }

        .form-group input[type="file"] {
            display: block;
            width: 100%;
        }

        .imagem-atual {
            max-width: 180px;
            max-height: 120px;
            display: block;
            margin-top: 10px;
            border: 1px solid #bdbeaf;
            border-radius: 4px;
        }

        .imagem-remover {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            color: #003366;
        }

        .alternativa-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .alternativa-item input[type="text"] {
            flex: 1;
        }

        .alternativa-item input[type="radio"] {
            margin: 0;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
        }

        .btn-xp-clss {
            display: inline-block;
            text-decoration: none;
            font-family: Tahoma, sans-serif;
            font-size: 11px;
            color: #000000 !important;
            background: linear-gradient(to bottom, #ffffff 0%, #f0f0ea 70%, #e2e2d4 100%);
            border: 1px solid #707070;
            border-radius: 3px;
            padding: 4px 12px;
            cursor: pointer;
            box-shadow: inset -1px -1px 1px #999999, 1px 1px 2px rgba(0,0,0,0.1);
            text-align: center;
        }

        .btn-xp-clss:hover {
            background: linear-gradient(to bottom, #fff8dd 0%, #ffeeb5 70%, #ffdd75 100%);
            border-color: #ffb515;
        }

        .btn-xp-clss:active {
            background: #e5e5e5;
            box-shadow: inset 1px 1px 2px #666666;
        }

        .btn-cancelar {
            color: #666;
            text-decoration: none;
        }

        .btn-cancelar:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="login-screen">
    <div class="login-screen__top"></div>

    <div class="login-screen__center">

        <div class="form-header">
            <h1>Nova Pergunta</h1>
            <p th:text="'Corrida: ' + ${corrida.nome}">Corrida</p>
        </div>

        <div class="form-content">
            <form th:action="@{/corridas/{corridaId}/perguntas/salvar(corridaId=${corrida.id})}" method="post" enctype="multipart/form-data">
                <input type="hidden" name="perguntaId" th:value="${pergunta.id}" th:if="${edicao}" />

                <div class="form-group">
                    <label for="enunciado">Enunciado:</label>
                    <input type="text" id="enunciado" name="enunciado" th:value="${pergunta.enunciado}"
                           placeholder="Digite a pergunta" required>
                </div>

                <div class="form-group">
                    <label for="imagemFile">Imagem da Pergunta (Opcional):</label>
                    <input type="file" id="imagemFile" name="imagemFile" accept="image/*">
                    <img th:if="${edicao and pergunta.imagem != null}" th:src="@{/imagens-upload/{nome}(nome=${pergunta.imagem})}" class="imagem-atual" alt="Imagem atual da pergunta">
                    <label class="imagem-remover" th:if="${edicao and pergunta.imagem != null}">
                        <input type="checkbox" name="removerImagem" value="true">
                        Remover imagem atual
                    </label>
                </div>

                <div class="form-group">
                    <label>Alternativas (marque a correta):</label>

                    <div class="alternativa-item">
                        <input type="radio" name="respostaCorreta" value="0" th:checked="${pergunta.respostaCorreta == 0}" required>
                        <input type="text" name="alternativas" placeholder="Alternativa A" th:value="${pergunta.alternativas != null and pergunta.alternativas.size() > 0 ? pergunta.alternativas[0] : ''}" required>
                    </div>
                    <div class="alternativa-item">
                        <input type="radio" name="respostaCorreta" value="1" th:checked="${pergunta.respostaCorreta == 1}">
                        <input type="text" name="alternativas" placeholder="Alternativa B" th:value="${pergunta.alternativas != null and pergunta.alternativas.size() > 1 ? pergunta.alternativas[1] : ''}" required>
                    </div>
                    <div class="alternativa-item">
                        <input type="radio" name="respostaCorreta" value="2" th:checked="${pergunta.respostaCorreta == 2}">
                        <input type="text" name="alternativas" placeholder="Alternativa C" th:value="${pergunta.alternativas != null and pergunta.alternativas.size() > 2 ? pergunta.alternativas[2] : ''}" required>
                    </div>
                </div>

                <div class="button-group">
                    <a th:href="@{/corridas}" class="btn-xp-clss">Voltar ao lobby</a>
                    <button type="submit" class="login-screen__submit" style="padding: 10px 28px; width: auto;" th:text="${edicao} ? 'Atualizar Pergunta' : 'Salvar Pergunta'">Salvar Pergunta</button>
                </div>
            </form>
        </div>

    </div>

    <div class="login-screen__bottom">
        <div class="login-screen__login-info">
            <span>XP Corridas © IFPB PWEB2</span>
        </div>
    </div>
</div>
</body>
</html>
