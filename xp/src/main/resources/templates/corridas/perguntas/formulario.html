<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>XP Corridas - Nova Pergunta</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; }

        .login-screen__center {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-family: Tahoma, sans-serif;
        }

        .form-header h1 { font-size: 2.2em; margin: 0; }

        .form-content {
            width: 90%;
            max-width: 560px;
            background: rgba(255, 255, 255, 0.95);
            padding: 36px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #00489a;
            color: #333;
            font-family: Tahoma, sans-serif;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #00489a;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1em;
        }

        .alternativa-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .alternativa-item input[type="text"] {
            flex: 1;
        }

        .alternativa-item input[type="radio"] {
            margin: 0;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
        }

        .btn-cancelar {
            color: #666;
            text-decoration: none;
        }

        .btn-cancelar:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="login-screen">
    <div class="login-screen__top"></div>

    <div class="login-screen__center">

        <div class="form-header">
            <h1>➕ Nova Pergunta</h1>
            <p th:text="'Corrida: ' + ${corrida.nome}">Corrida</p>
        </div>

        <div class="form-content">
            <form th:action="@{/corridas/{id}/perguntas/salvar(id=${corrida.id})}" method="post">

                <div class="form-group">
                    <label for="enunciado">Enunciado:</label>
                    <input type="text" id="enunciado" name="enunciado"
                           placeholder="Digite a pergunta" required>
                </div>

                <div class="form-group">
                    <label>Alternativas (marque a correta):</label>

                    <div class="alternativa-item">
                        <input type="radio" name="respostaCorreta" value="0" required>
                        <input type="text" name="alternativas" placeholder="Alternativa A" required>
                    </div>
                    <div class="alternativa-item">
                        <input type="radio" name="respostaCorreta" value="1">
                        <input type="text" name="alternativas" placeholder="Alternativa B" required>
                    </div>
                    <div class="alternativa-item">
                        <input type="radio" name="respostaCorreta" value="2">
                        <input type="text" name="alternativas" placeholder="Alternativa C" required>
                    </div>
                </div>

                <div class="button-group">
                    <a th:href="@{/corridas/{id}/perguntas(id=${corrida.id})}" class="btn-cancelar">Cancelar</a>
                    <button type="submit" class="login-screen__submit" style="padding: 10px 28px; width: auto;">
                        Salvar Pergunta
                    </button>
                </div>
            </form>
        </div>

    </div>

    <div class="login-screen__bottom">
        <div class="login-screen__login-info">
            <span>XP Corridas © IFPB PWEB2</span>
        </div>
    </div>
</div>
</body>
</html>
