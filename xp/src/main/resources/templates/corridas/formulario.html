<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${edicao} ? 'XP Corridas - Editar Pergunta' : 'XP Corridas - Nova Pergunta'">XP Corridas - Pergunta</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; }

        .login-screen__center {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-header {
            text-align: center;
            margin-bottom: 20px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .form-header h1 {
            font-size: 2.2em;
            margin: 0;
            font-family: 'Tahoma', sans-serif;
        }

        .form-content {
            width: 90%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #00489a;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-family: 'Tahoma', sans-serif;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1em;
            color: #00489a;
        }

        .form-group input[type="text"], 
        .form-group input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95em;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0058e3;
            box-shadow: 0 0 5px rgba(0,88,227,0.3);
        }

        .alternativas-bucket {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 6px;
            border: 1px dashed #00489a;
            margin-bottom: 15px;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        .btn-cancelar {
            color: #666;
            text-decoration: none;
            font-family: 'Tahoma', sans-serif;
            font-size: 0.9em;
        }

        .btn-cancelar:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-screen">
        <div class="login-screen__top"></div>

        <div class="login-screen__center">
            
            <div class="form-header">
                <h1 th:text="${edicao} ? '✏️ Editar Pergunta' : '🆕 Nova Pergunta'">Nova Pergunta</h1>
                <p>Corrida: <strong th:text="${corrida.nome}">Nome da Corrida</strong></p>
            </div>

            <div class="form-content">
                <form th:action="@{/corridas/{id}/perguntas/salvar(id=${corrida.id})}" th:object="${pergunta}" method="post" enctype="multipart/form-data">

                    <div class="form-group">
                        <label for="enunciado">Enunciado da Pergunta:</label>
                        <input type="text" id="enunciado" name="enunciado" placeholder="Ex: Qual é a sintaxe correta para..." required>
                    </div>

                    <div class="form-group">
                        <label for="imagemFile">Imagem Ilustrativa (Opcional):</label>
                        <input type="file" id="imagemFile" name="imagemFile" accept="image/*">
                    </div>

                    <div class="alternativas-bucket">
                        <label style="font-family: 'Tahoma', sans-serif; font-weight: bold; color: #00489a; display:block; margin-bottom: 10px;">
                            Alternativas:
                        </label>
                        
                        <div class="form-group">
                            <label>Alternativas (marque a correta):</label>

                            <div class="alternativa-item">
                                <input type="radio" name="respostaCorreta" value="0" required>
                                <input type="text" name="alternativas[0]" placeholder="Alternativa A" required>
                            </div>
                            <div class="alternativa-item">
                                <input type="radio" name="respostaCorreta" value="1">
                                <input type="text" name="alternativas[1]" placeholder="Alternativa B" required>
                            </div>
                            <div class="alternativa-item">
                                <input type="radio" name="respostaCorreta" value="2">
                                <input type="text" name="alternativas[2]" placeholder="Alternativa C" required>
                            </div>
                        </div>
                    <div class="button-group">
                        <a th:href="@{/corridas/{id}/perguntas(id=${corrida.id})}" class="btn-cancelar">Cancelar</a>
                        <button type="submit" class="login-screen__submit" style="padding: 10px 30px; width: auto;">
                            Salvar Pergunta
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="login-screen__bottom">
            <div class="login-screen__login-info">
                <span>XP Corridas © IFPB PWEB2</span>
            </div>
        </div>
    </div>
</body>
</html>
