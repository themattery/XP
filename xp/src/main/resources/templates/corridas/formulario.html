<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${edicao} ? 'XP Corridas - Editar Corrida' : 'XP Corridas - Nova Corrida'">XP Corridas - Corrida</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; }

        .login-screen__center {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-header {
            text-align: center;
            margin-bottom: 20px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .form-header h1 {
            font-size: 2.2em;
            margin: 0;
            font-family: 'Tahoma', sans-serif;
        }

        .form-content {
            width: 90%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #00489a;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-family: 'Tahoma', sans-serif;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1em;
            color: #00489a;
        }

        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95em;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0058e3;
            box-shadow: 0 0 5px rgba(0,88,227,0.3);
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        .btn-cancelar {
            color: #666;
            text-decoration: none;
            font-family: 'Tahoma', sans-serif;
            font-size: 0.9em;
        }

        .btn-cancelar:hover {
            text-decoration: underline;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-screen">
        <div class="login-screen__top"></div>

        <div class="login-screen__center">
            <div class="form-header">
                <h1 th:text="${edicao} ? '✏️ Editar Corrida' : '🆕 Nova Corrida'">Nova Corrida</h1>
                <p th:if="${edicao}">Atualize os dados desta corrida.</p>
                <p th:unless="${edicao}">Cadastre uma nova corrida.</p>
            </div>

            <div class="form-content">
                <form th:action="@{/corridas/salvar}" th:object="${corrida}" method="post">
                    <input type="hidden" th:field="*{id}" />

                    <div class="form-group">
                        <label for="nome">Nome da Corrida</label>
                        <input type="text" id="nome" th:field="*{nome}" placeholder="Ex: Grande Prêmio XP" required>
                    </div>

                    <div class="form-group">
                        <label for="tempoLimiteSegundos">Tempo limite (segundos)</label>
                        <input type="number" id="tempoLimiteSegundos" th:field="*{tempoLimiteSegundos}" min="10" required>
                    </div>

                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="ativa" th:field="*{ativa}" />
                        <label for="ativa">Corrida ativa</label>
                    </div>

                    <div class="button-group">
                        <a th:href="@{/corridas}" class="btn-xp-clss">Cancelar</a>
                        <button type="submit" class="btn-xp-clss btn-xp-clss--iniciar" style="padding: 6px 16px; font-weight: bold;">
                            Salvar Corrida
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="login-screen__bottom">
            <div class="login-screen__login-info">
                <span>XP Corridas © IFPB PWEB2</span>
            </div>
        </div>
    </div>
</body>
</html>
